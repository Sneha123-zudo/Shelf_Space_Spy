[project]
name = "shelf-space-spy-api"
version = "0.1.0"
description = "FastAPI backend for Shelf Space Spy"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "email-validator>=2.2,<3.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "PyJWT>=2.10,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "rapidfuzz>=3.9,<4.0",
  "anthropic>=0.40",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "UP017", "UP038"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long literal fixtures read better on one line

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
